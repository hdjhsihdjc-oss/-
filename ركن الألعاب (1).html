<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ركن الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--navy:#2d2a62;--yellow:#ffd414;--yellow-d:#d4a600;--pink:#ff6f9f;--pink-d:#d64a7a;--cyan:#3fcbec;--cyan-d:#1ea2c3;--green:#6ee7a9;--green-d:#3dbd80;--bg:#fdf6e3;--fg:#2d2a62;--pill-bg:#2d2a62;--pill-fg:#ffd414;--c1:#ffe98a;--c2:#c9ecea;--back-bg:#fff;--shadow:rgba(45,42,98,.22);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2860;--fg:#fdf6e3;--pill-bg:#ffd414;--pill-fg:#2d2a62;--c1:#46438f;--c2:#38367c;--back-bg:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2860;--fg:#fdf6e3;--pill-bg:#ffd414;--pill-fg:#2d2a62;--c1:#46438f;--c2:#38367c;--back-bg:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.4);color-scheme:dark}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--fg);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;font-weight:600;position:relative}
body::before{content:"";position:fixed;top:-70px;right:-70px;width:230px;height:230px;border-radius:50%;background:var(--c1);z-index:-1}
body::after{content:"";position:fixed;bottom:90px;left:-80px;width:190px;height:190px;border-radius:50%;background:var(--c2);z-index:-1}
#app{max-width:520px;margin:0 auto;padding:18px 18px 34px;box-sizing:border-box}
h1,h2,.d{font-family:Lalezar,Cairo,system-ui,sans-serif;font-weight:400}
h1{font-size:38px;margin:6px 0 2px;line-height:1.2}
h2{font-size:28px;margin:0;line-height:1.2}
p{margin:6px 0;line-height:1.6}
.hero{padding:6px 0 4px}
.brand{display:inline-block;background:var(--pill-bg);color:var(--pill-fg);border-radius:999px;padding:5px 16px;font-size:15px;font-weight:800}
.sub{opacity:.7;font-size:15px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.g{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;min-height:138px;padding:16px 18px;border:0;border-radius:28px;background:var(--bg-c);color:var(--navy);text-decoration:none;text-align:right;font-family:inherit;box-shadow:0 7px 0 var(--edge),0 16px 24px var(--shadow);transition:transform .12s,box-shadow .12s;animation:up .5s both}
.g::before{content:"";position:absolute;top:0;left:0;right:0;height:30%;background:rgba(255,255,255,.2)}
.g:active{transform:translateY(6px);box-shadow:0 1px 0 var(--edge),0 4px 8px var(--shadow)}
.g.big{grid-column:1/-1;min-height:170px}
.g:nth-child(2){animation-delay:.08s}.g:nth-child(3){animation-delay:.16s}.g:nth-child(4){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ic{position:absolute;top:14px;right:14px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal}
.g.big .ic{width:76px;height:76px;font-size:40px}
.g b{position:relative;font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:24px;line-height:1.2}
.g small{position:relative;opacity:.7;font-size:13px;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.back{width:46px;height:46px;border:0;border-radius:50%;background:var(--back-bg);color:var(--navy);font-size:28px;line-height:1;font-family:inherit;box-shadow:0 5px 12px var(--shadow);padding:0 0 4px}
.btn{display:block;width:100%;padding:15px;margin:14px 0;border:0;border-radius:999px;background:var(--yellow);color:var(--navy);font-size:19px;font-family:Lalezar,Cairo,sans-serif;box-shadow:0 6px 0 var(--yellow-d);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--yellow-d)}
.btn.sec{background:var(--navy);color:var(--yellow);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.btn.sec:active{box-shadow:0 1px 0 rgba(0,0,0,.3)}
.panel{position:relative;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:30px;padding:26px 18px;box-shadow:0 16px 30px var(--shadow);background-image:radial-gradient(circle at 24px calc(100% - 24px),var(--green) 8px,transparent 9px),radial-gradient(circle at calc(100% - 24px) calc(100% - 24px),var(--yellow) 8px,transparent 9px)}
.panel::before,.panel::after{content:"";position:absolute;top:14px;width:16px;height:16px;border-radius:50%}
.panel::before{left:16px;background:var(--cyan)}.panel::after{right:16px;background:var(--pink)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.c{aspect-ratio:1;border:3px solid var(--navy);border-radius:20px;background:#fdf6e3;color:var(--navy);font-size:44px;font-family:inherit;padding:0;box-shadow:0 4px 0 var(--navy)}
.c.pop{animation:pop .28s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
.c.w{background:var(--green);animation:pl .7s infinite alternate}
@keyframes pl{to{transform:scale(1.07)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.m{aspect-ratio:1;border:0;border-radius:20px;background:var(--navy);color:var(--yellow);font-size:36px;font-family:Lalezar,sans-serif;padding:0;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.m.o{background:#fdf6e3;color:var(--navy);box-shadow:0 5px 0 #d8cfb3}
.m.d{background:var(--green);color:var(--navy);box-shadow:0 5px 0 var(--green-d)}
.sc{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.sc span{background:var(--pill-bg);color:var(--pill-fg);border-radius:999px;padding:6px 16px;font-weight:800;font-size:15px}
.msg{display:table;margin:16px auto;background:var(--pill-bg);color:var(--pill-fg);border-radius:999px;padding:8px 24px;font-family:Lalezar,Cairo,sans-serif;font-size:20px;text-align:center}
.stat{text-align:center;font-size:16px;margin:0 0 4px}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:999px;border:3px solid var(--navy);background:#fdf6e3;color:var(--navy);font-size:30px;text-align:center;font-family:Lalezar,sans-serif}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf i{position:absolute;top:-40px;font-style:normal;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#wr h1{font-size:28px;margin:12px 0 4px;text-align:center}
#wr h2{font-size:20px;margin:8px 0;text-align:center}
#wr p{margin:6px 0;text-align:center;line-height:1.6}
#wr .sub{opacity:.7}
#wr .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
#wr input{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;font-family:inherit}
#wr .btn{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font-size:18px;font-weight:700;font-family:inherit}
#wr .btn.sec{background:var(--key);color:var(--fg)}
#wr .row{display:flex;gap:8px;align-items:center;justify-content:center}
#wr .row .btn{margin:6px 0}
#wr .board{display:grid;gap:8px;margin:14px auto;direction:rtl;width:100%;max-width:360px}
#wr .line{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#wr .cell{aspect-ratio:1;width:100%;margin:auto;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:10px;font-size:32px;font-weight:700}
#wr .cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
#wr .cell.mid{background:var(--mid);border-color:var(--mid);color:#0f2350}
#wr .cell.no{background:var(--no);border-color:var(--no);color:#fff}
#wr .kb{margin-top:auto;padding-top:8px}
#wr .kr{display:flex;gap:4px;justify-content:center;margin:4px 0}
#wr .k{position:relative;flex:1;min-width:0;height:46px;border:0;border-radius:8px;background:var(--key);color:var(--fg);font-size:18px;font-weight:700;font-family:inherit;padding:0}
#wr .k.ent{flex:1;font-size:17px;background:var(--acc);color:var(--accfg)}
#wr .sup{position:absolute;top:2px;right:5px;font-size:10px;opacity:.7}
#wr .k.ok{background:var(--ok);color:#fff}
#wr .k.mid{background:var(--mid);color:#0f2350}
#wr .k.no{background:var(--no);color:#fff}
#wr .score{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line)}
#wr .score:last-child{border:0}
#wr .toast{text-align:center;min-height:22px;color:var(--mid);font-weight:700}
#wr .big{font-size:40px;text-align:center;margin:6px 0}
#wr{display:flex;flex-direction:column;min-height:78vh;--card:#fff;--line:#cfc6a8;--key:#fff;--ok:#17935f;--mid:#ffd414;--no:#8b89ad;--acc:#ffd414;--accfg:#2d2a62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #wr{--line:#5a56a8;--key:#4a4690;--no:#5d5a99}}
:root[data-theme="dark"] #wr{--line:#5a56a8;--key:#4a4690;--no:#5d5a99}
#wr h1,#wr h2,#wr p{text-align:center}
#wr .btn{border-radius:999px;font-family:Lalezar,Cairo,sans-serif;font-size:19px;font-weight:400;box-shadow:0 6px 0 var(--yellow-d)}
#wr .btn.sec{background:var(--navy);color:var(--yellow);box-shadow:0 6px 0 rgba(0,0,0,.3)}
#wr .card{background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:24px}
#wr .cell.mid,#wr .k.mid{color:#2d2a62}
#wr .k{box-shadow:0 3px 0 rgba(0,0,0,.2);font-family:inherit}
#wr .toast{color:var(--yellow-d)}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 18px}
.step b{font-family:Lalezar,sans-serif;font-weight:400;font-size:44px;min-width:70px;text-align:center}
.stp{width:52px;height:52px;border:0;border-radius:50%;background:var(--yellow);color:var(--navy);font-size:30px;font-family:inherit;box-shadow:0 4px 0 var(--yellow-d);padding:0 0 4px}
.panel.dark{background-color:var(--navy);color:var(--yellow);border-color:var(--navy)}
.huge{font-family:Lalezar,Cairo,sans-serif;font-size:44px;text-align:center;line-height:1.3;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
var app=document.getElementById("app");
function home(){clearInterval(P.timer);
  app.innerHTML='<div class="hero"><span class="brand">🎮 ركن الألعاب</span><p class="sub" style="margin:14px 0 0">أهلاً يا شباب 👋</p><h1>اختر لعبتك</h1></div><div class="games">'+
  '<button class="g big" style="--bg-c:var(--yellow);--edge:var(--yellow-d)" onclick="wr()"><i class="ic">🔤</i><b>سباق الكلمة</b><small>خمّن الكلمة، أونلاين أو جوال واحد</small></button>'+
  '<button class="g" style="--bg-c:var(--pink);--edge:var(--pink-d)" onclick="xo()"><i class="ic">❌</i><b>إكس أو</b><small>لاعبين على جوال</small></button>'+
  '<button class="g" style="--bg-c:var(--cyan);--edge:var(--cyan-d)" onclick="mem()"><i class="ic">🧠</i><b>الذاكرة</b><small>طابق البطاقات</small></button>'+
  '<button class="g" style="--bg-c:var(--green);--edge:var(--green-d)" onclick="guess()"><i class="ic">🔢</i><b>خمّن الرقم</b><small>من 1 إلى 100</small></button>'+
  '<button class="g" style="--bg-c:var(--navy);--edge:#161436;color:var(--yellow);border:2px solid rgba(255,255,255,.18)" onclick="spy()"><i class="ic">🕵️</i><b>مين الجاسوس</b><small>اكشف الجاسوس بينكم</small></button></div>';
}
function bar(t){return '<div class="top"><h2>'+t+'</h2><button class="back" onclick="home()">›</button></div>'}
function conf(){
  var d=document.createElement("div"),e=["🎉","⭐","✨","💛","💙"],h="";
  d.className="cf";
  for(var i=0;i<32;i++)h+='<i style="left:'+Math.floor(Math.random()*96)+'%;animation-duration:'+(1.8+Math.random()*1.4).toFixed(1)+'s;animation-delay:'+(Math.random()*.6).toFixed(1)+'s">'+e[i%5]+'</i>';
  d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},4200);
}

/* إكس أو */
var X={b:[],t:"X",s:{X:0,O:0,d:0},over:false,last:-1};
var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xo(){X.b=Array(9).fill("");X.last=-1;X.t="X";X.over=false;X.w=null;X.m="";drawX()}
function drawX(){
  var h=bar("إكس أو")+'<div class="sc"><span>❌ '+X.s.X+'</span><span>تعادل '+X.s.d+'</span><span>⭕ '+X.s.O+'</span></div><div class="msg">'+(X.m||'الدور على '+(X.t==="X"?"❌":"⭕"))+'</div><div class="panel"><div class="board">';
  X.b.forEach(function(v,i){h+='<button class="c'+(X.w&&X.w.indexOf(i)>-1?' w':(i===X.last?' pop':''))+'" onclick="mv('+i+')">'+(v==="X"?"❌":v==="O"?"⭕":"")+'</button>'});
  app.innerHTML=h+'</div></div><button class="btn" onclick="xo()">جولة جديدة</button>';
}
function mv(i){
  if(X.over||X.b[i])return;
  X.b[i]=X.t;X.last=i;
  for(var k=0;k<L.length;k++){var a=L[k];if(X.b[a[0]]&&X.b[a[0]]===X.b[a[1]]&&X.b[a[1]]===X.b[a[2]]){X.over=true;X.w=a;X.s[X.t]++;X.m="🎉 فاز "+(X.t==="X"?"❌":"⭕");drawX();return conf()}}
  if(X.b.every(function(v){return v})){X.over=true;X.s.d++;X.m="تعادل 🤝";return drawX()}
  X.t=X.t==="X"?"O":"X";drawX();
}

/* الذاكرة */
var M={};
function mem(){
  var e=["🐪","🌴","☕","🚗","⚽","🌙"],a=e.concat(e);
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
  M={c:a,o:[],d:[],n:0,lock:false};drawM();
}
function drawM(){
  var h=bar("لعبة الذاكرة")+'<div class="msg">'+(M.d.length===12?'🎉 خلصتها في '+M.n+' حركة!':'الحركات: '+M.n)+'</div><div class="panel"><div class="mem">';
  M.c.forEach(function(v,i){var d=M.d.indexOf(i)>-1,o=M.o.indexOf(i)>-1;h+='<button class="m'+(d?' d':o?' o':'')+'" onclick="flip('+i+')">'+(d||o?v:"?")+'</button>'});
  app.innerHTML=h+'</div></div><button class="btn" onclick="mem()">لعبة جديدة</button>';
}
function flip(i){
  if(M.lock||M.o.indexOf(i)>-1||M.d.indexOf(i)>-1)return;
  M.o.push(i);
  if(M.o.length===2){
    M.n++;var a=M.o[0],b=M.o[1];
    if(M.c[a]===M.c[b]){M.d.push(a,b);M.o=[];if(M.d.length===12)setTimeout(conf,150)}
    else{M.lock=true;drawM();return setTimeout(function(){M.o=[];M.lock=false;drawM()},800)}
  }
  drawM();
}

/* خمّن الرقم */
var G={};
function guess(){G={n:1+Math.floor(Math.random()*100),t:0,m:"اكتب رقم من 1 إلى 100",done:false};drawG()}
function drawG(){
  app.innerHTML=bar("خمّن الرقم")+'<div class="msg">'+G.m+'</div><div class="panel"><p class="stat">المحاولات: <b>'+G.t+'</b></p>'+
  (G.done?'<p class="stat" style="font-size:54px">🎉</p>':'<input id="gi" type="number" inputmode="numeric" min="1" max="100" placeholder="؟">')+'</div>'+
  (G.done?'':'<button class="btn" onclick="tryG()">خمّن</button>')+'<button class="btn sec" onclick="guess()">لعبة جديدة</button>';
}
function tryG(){
  var v=parseInt(document.getElementById("gi").value,10);
  if(!(v>=1&&v<=100)){G.m="اكتب رقم من 1 إلى 100";return drawG()}
  G.t++;
  if(v===G.n){G.done=true;G.m="صح! الرقم "+G.n;setTimeout(conf,150)}
  else G.m=v<G.n?"⬆️ أكبر من "+v:"⬇️ أصغر من "+v;
  drawG();
}

var WORDS=["مدرسة","سيارة","حديقة","مكتبة","مفتاح","رسالة","جميلة","كبيرة","صغيرة","تفاحة","بطاطس","طماطم","فنجان","ملعقة","نافذة","مروحة","حقيبة","سفينة","دراجة","مزرعة","بحيرة","جزيرة","عاصفة","زرافة","دجاجة","فراشة","عصفور","حمامة","مدينة","رياضة","خزانة","ثلاجة","مكنسة","وسادة","ستارة","صابون","مسطرة","محفظة","ميزان","ليمون","زيتون","سلطان"].filter(function(w){return w.length===5});
var ROUNDS=3,MAXT=6;
var ROWS=[["ج","ح","خ","ه","ع","غ","ف","ق","ث","ص","ض"],["ط","ك","م","ن","ت","ا","ل","ب","ي","س","ش"],["⌫","د","ظ","ز","و","ة","ى","ر","ؤ","ء","ذ"],["إدخال"]];
var NUM={"ض":"١","ص":"٢","ث":"٣","ق":"٤","ف":"٥","غ":"٦","ع":"٧","ه":"٨","خ":"٩","ح":"٠"};
var S={names:["لاعب 1","لاعب 2"]},wapp=null;
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function setup(){
  var h='<p class="sub">خمّن الكلمة من 5 حروف في 6 محاولات. أقل محاولات = نقاط أكثر.</p><div class="card"><h2>اللاعبين</h2>';
  S.names.forEach(function(n,i){h+='<input id="n'+i+'" value="'+esc(n)+'" maxlength="12">'});
  h+='<div class="row"><button class="btn sec" onclick="chg(1)">+ لاعب</button><button class="btn sec" onclick="chg(-1)">− لاعب</button></div></div>';
  h+='<button class="btn" onclick="startGame()">ابدأ اللعب (جوال واحد)</button><button class="btn sec" onclick="onlineMenu()">🌐 العب أونلاين مع أصدقائك</button><p class="sub">'+ROUNDS+' جولات.</p>';
  wapp.innerHTML=h;
}
function readNames(){S.names=S.names.map(function(n,i){var e=document.getElementById("n"+i);return e&&e.value.trim()?e.value.trim():"لاعب "+(i+1)})}
function chg(d){readNames();var n=S.names.length+d;if(n<1||n>6)return;if(d>0)S.names.push("لاعب "+n);else S.names.pop();setup()}
function startGame(){
  readNames();
  S.players=S.names.map(function(n){return{n:n,score:0}});
  S.deck=shuffle(WORDS);S.round=0;newRound();
}
function newRound(){S.word=S.deck[S.round];S.pi=0;S.res=[];pass()}
function pass(){
  wapp.innerHTML='<h2>جولة '+(S.round+1)+' من '+ROUNDS+'</h2><div class="big">📱</div><p>سلّم الجوال لـ</p><h1>'+esc(S.players[S.pi].n)+'</h1><p class="sub">لا تخلّي غيره يشوف الشاشة</p><button class="btn" style="margin-top:auto" onclick="play()">جاهز</button>';
}
function play(){S.g=[];S.cur="";S.over=false;S.kst={};draw()}
function ev(g,w){
  var r=["no","no","no","no","no"],c={},i;
  for(i=0;i<5;i++){if(g[i]===w[i])r[i]="ok";else c[w[i]]=(c[w[i]]||0)+1}
  for(i=0;i<5;i++){if(r[i]!=="ok"&&c[g[i]]>0){r[i]="mid";c[g[i]]--}}
  return r;
}
function draw(msg){
  var h='<p><b>'+(S.online?esc(ME):esc(S.players[S.pi].n))+'</b> · جولة '+(S.round+1)+'</p>'+(S.online?'<p class="sub" style="font-size:13px;margin:0">'+chips()+'</p>':'')+'<div class="board">';
  for(var r=0;r<MAXT;r++){
    h+='<div class="line">';
    var g=S.g[r],ex=g?ev(g,S.word):null;
    for(var c=0;c<5;c++){
      var ch=g?g[c]:(r===S.g.length&&!S.over?(S.cur[c]||""):"");
      h+='<div class="cell '+(ex?ex[c]:"")+'">'+ch+'</div>';
    }
    h+='</div>';
  }
  h+='</div><div class="toast" id="t">'+(msg||"")+'</div><div class="kb">';
  ROWS.forEach(function(row){
    h+='<div class="kr">';
    row.forEach(function(k){
      var wide=k==="إدخال"?" ent":"";
      h+='<button class="k'+wide+' '+(S.kst[k]||"")+'" onclick="key(\''+k+'\')">'+(NUM[k]?'<span class="sup">'+NUM[k]+'</span>':'')+k+'</button>';
    });
    h+='</div>';
  });
  wapp.innerHTML=h+'</div>';
}
function key(k){
  if(S.over)return;
  if(k==="⌫"){S.cur=S.cur.slice(0,-1);return draw()}
  if(k==="إدخال"){
    if(S.cur.length<5)return draw("الكلمة 5 حروف");
    var g=S.cur,ex=ev(g,S.word),rank={no:1,mid:2,ok:3};
    for(var i=0;i<5;i++){var o=S.kst[g[i]];if(!o||rank[ex[i]]>rank[o])S.kst[g[i]]=ex[i]}
    S.g.push(g);S.cur="";if(S.online)pub();
    var win=g===S.word;
    if(win||S.g.length===MAXT){S.over=true;draw();setTimeout(function(){endTurn(win)},900)}
    else draw();
    return;
  }
  if(S.cur.length<5){S.cur+=k;draw()}
}
function endTurn(win){if(S.online)return oEnd(win);
  var pts=win?(MAXT+1-S.g.length):0;
  S.res.push({pts:pts,win:win,t:S.g.length});
  S.players[S.pi].score+=pts;
  var h='<div class="big">'+(win?"🎉":"😅")+'</div><h1>'+(win?"أحسنت!":"ما انحلت")+'</h1><p>'+(win?'حليتها في '+S.g.length+' محاولات<br><b>+'+pts+' نقاط</b>':'خلصت المحاولات، 0 نقاط')+'</p><p class="sub">الكلمة بتنكشف لما الكل يلعب</p><button class="btn" style="margin-top:auto" onclick="nextTurn()">التالي</button>';
  wapp.innerHTML=h;
}
function nextTurn(){S.pi++;if(S.pi<S.players.length)pass();else summary()}
function summary(){
  var last=S.round===ROUNDS-1;
  var h='<h2>نتيجة الجولة '+(S.round+1)+'</h2><p>الكلمة كانت</p><h1>'+S.word+'</h1><div class="card">';
  S.players.forEach(function(p,i){
    var r=S.res[i];
    h+='<div class="score"><span>'+esc(p.n)+' <span class="sub">'+(r.win?'('+r.t+' محاولات)':'(ما حلها)')+'</span></span><b>+'+r.pts+'</b></div>';
  });
  h+='</div><button class="btn" onclick="'+(last?'final()':'nextRound()')+'">'+(last?'النتيجة النهائية':'الجولة التالية')+'</button>';
  wapp.innerHTML=h;
}
function nextRound(){S.round++;newRound()}
function final(){
  var s=S.players.slice().sort(function(a,b){return b.score-a.score});
  var top=s[0].score,winners=s.filter(function(p){return p.score===top});
  var h='<div class="big">🏆</div><h1>'+(winners.length>1?'تعادل!':esc(s[0].n)+' فاز!')+'</h1><div class="card">';
  s.forEach(function(p,i){h+='<div class="score"><span>'+(i+1)+'. '+esc(p.n)+'</span><b>'+p.score+'</b></div>'});
  h+='</div><button class="btn" onclick="startGame()">العب مرة ثانية</button><button class="btn sec" onclick="setup()">تغيير اللاعبين</button>';
  wapp.innerHTML=h;
}
var R=null,RM=null,ME="";
try{claude.use("room").then(function(r){R=r}).catch(function(){})}catch(e){}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(a,seed){a=a.slice();var r=rng(seed);for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function plist(){return RM?RM.peers().filter(function(p){return p.presence&&p.presence.nm}):[]}
function sum(a){return(a||[]).reduce(function(x,y){return x+y},0)}
function fin(q){return q.r>S.round||(q.r===S.round&&q.d)}
function chips(){return plist().filter(function(p){return !p.isMe}).map(function(p){var q=p.presence;return esc(q.nm)+' '+(fin(q)?'✅':(q.p||[]).length+'/6')}).join(' · ')}
function onlineMenu(msg){
  S.screen="menu";
  if(!R){wapp.innerHTML='<h2>🌐 أونلاين</h2><p>اللعب الأونلاين يشتغل بس إذا فتحت الصفحة وأنت داخل بحسابك في Claude، وأصدقاءك مدعوين للصفحة من زر المشاركة.</p><button class="btn" onclick="setup()">رجوع</button>';return}
  wapp.innerHTML='<h2>🌐 أونلاين</h2><div class="card"><input id="on" placeholder="اسمك" maxlength="12" value="'+esc(ME)+'"><button class="btn" onclick="mk()">أنشئ غرفة</button></div><div class="card"><input id="oc" placeholder="كود الغرفة (4 أرقام)" inputmode="numeric" maxlength="4"><button class="btn sec" onclick="jn()">ادخل غرفة</button></div><div class="toast">'+(msg||"")+'</div><button class="btn sec" onclick="setup()">رجوع</button>';
}
function nm(){var v=document.getElementById("on").value.trim();ME=v||"لاعب";return ME}
function mk(){var n=nm();enter(String(1000+Math.floor(Math.random()*9000)),1,n)}
function jn(){var n=nm(),c=document.getElementById("oc").value.trim();if(!/^[0-9]{4}$/.test(c))return onlineMenu("اكتب كود من 4 أرقام");enter(c,0,n)}
async function enter(code,host,n){
  try{RM=await R.join("wr"+code)}catch(e){return onlineMenu("ما قدرت أدخل الغرفة")}
  S.online=1;S.code=code;S.host=host;S.round=0;S.mypts=[];S.deck=sshuffle(WORDS,parseInt(code,10));S.screen="lobby";
  S.off=RM.onPeers(onP);
  await RM.presence({nm:n,h:host,st:0,r:0,d:0,p:[],pts:[]});
  lobby();
}
function lobby(){
  var ps=plist(),h='<h2>غرفة اللعب</h2><p class="sub">أعطِ الكود لأصدقائك</p><div class="big" style="letter-spacing:8px">'+S.code+'</div><div class="card">';
  ps.forEach(function(p){h+='<div class="score"><span>'+esc(p.presence.nm)+(p.isMe?' (أنت)':'')+'</span><span>'+(p.presence.h?'👑':'')+'</span></div>'});
  h+='</div>'+(S.host?'<button class="btn" onclick="goStart()">ابدأ اللعبة ('+ps.length+' لاعبين)</button>':'<p class="sub">ننتظر المضيف يبدأ...</p>');
  wapp.innerHTML=h+'<button class="btn sec" onclick="leaveRoom()">خروج</button>';
}
function goStart(){RM.presence({st:1});startOnline()}
function startOnline(){S.screen="play";S.round=0;S.word=S.deck[0];play()}
function onP(){
  if(!S.online)return;
  if(S.screen==="lobby"){
    if(!S.host&&plist().some(function(p){return p.presence.h&&p.presence.st}))return startOnline();
    lobby();
  }else if(S.screen==="wait")oWait();
  else if(S.screen==="play")draw();
}
function pub(){RM.presence({p:S.g.map(function(g){return ev(g,S.word).map(function(x){return x==="ok"?"2":x==="mid"?"1":"0"}).join("")})})}
function oEnd(win){
  var pts=win?(MAXT+1-S.g.length):0;
  S.mypts[S.round]=pts;S.last={win:win,pts:pts};
  RM.presence({d:1,pts:S.mypts});
  S.screen="wait";oWait();
}
function oWait(){
  var ps=plist();
  if(ps.every(function(p){return fin(p.presence)}))return oSum();
  var L=S.last,h='<div class="big">'+(L.win?"🎉":"😅")+'</div><h2>'+(L.win?'حليتها! +'+L.pts:'ما انحلت')+'</h2><p class="sub">ننتظر الباقي...</p><div class="card">';
  ps.forEach(function(p){var q=p.presence;h+='<div class="score"><span>'+esc(q.nm)+(p.isMe?' (أنت)':'')+'</span><span>'+(fin(q)?'✅':(q.p||[]).length+'/6')+'</span></div>'});
  wapp.innerHTML=h+'</div>';
}
function oSum(){
  S.screen="sum";
  var last=S.round===ROUNDS-1,h='<h2>نتيجة الجولة '+(S.round+1)+'</h2><p>الكلمة كانت</p><h1>'+S.word+'</h1><div class="card">';
  plist().forEach(function(p){var q=p.presence;h+='<div class="score"><span>'+esc(q.nm)+'</span><span><b>+'+((q.pts||[])[S.round]||0)+'</b> · المجموع '+sum(q.pts)+'</span></div>'});
  wapp.innerHTML=h+'</div><button class="btn" onclick="'+(last?'oFinal()':'oNext()')+'">'+(last?'النتيجة النهائية':'الجولة التالية')+'</button>';
}
function oNext(){S.round++;S.word=S.deck[S.round];RM.presence({r:S.round,d:0,p:[]});S.screen="play";play()}
function oFinal(){
  S.screen="fin";
  var ps=plist().map(function(p){return{n:p.presence.nm,t:sum(p.presence.pts)}}).sort(function(a,b){return b.t-a.t});
  var h='<div class="big">🏆</div><h1>'+(ps.length>1&&ps[0].t===ps[1].t?'تعادل!':esc(ps[0].n)+' فاز!')+'</h1><div class="card">';
  ps.forEach(function(p,i){h+='<div class="score"><span>'+(i+1)+'. '+esc(p.n)+'</span><b>'+p.t+'</b></div>'});
  wapp.innerHTML=h+'</div><button class="btn" onclick="leaveRoom()">خروج</button>';
}
function leaveRoom(){
  try{if(S.off)S.off();RM.leave()}catch(e){}
  RM=null;S.online=0;S.mypts=[];setup();
}

function wr(){app.innerHTML='<div class="top"><h2>سباق الكلمة</h2><button class="back" onclick="goHome()">›</button></div><div id="wr"></div>';wapp=document.getElementById("wr");S.online=0;setup()}
function goHome(){try{if(S.off)S.off();if(RM)RM.leave()}catch(e){}RM=null;S.online=0;home()}

/* مين الجاسوس */
var PLACES=["المطار","المستشفى","المدرسة","الحديقة","السوق","المطعم","الشاطئ","السينما","المكتبة","الملعب","الفندق","البنك","محطة القطار","السفينة","الصحراء","المخيم","المزرعة","حديقة الحيوان","الملاهي","المسجد","المخبز","محطة البنزين","الجامعة","المتحف"];
var P={n:4,min:5,i:0,spy:0,w:"",t:0,timer:null};
function fm(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function spy(){
  clearInterval(P.timer);
  app.innerHTML=bar("مين الجاسوس")+'<div class="panel"><p class="stat">عدد اللاعبين</p><div class="step"><button class="stp" onclick="pc(\'n\',1,3,12)">+</button><b>'+P.n+'</b><button class="stp" onclick="pc(\'n\',-1,3,12)">−</button></div><p class="stat">وقت النقاش (دقائق)</p><div class="step"><button class="stp" onclick="pc(\'min\',1,1,15)">+</button><b>'+P.min+'</b><button class="stp" onclick="pc(\'min\',-1,1,15)">−</button></div></div><p class="sub" style="text-align:center;margin-top:14px">واحد منكم جاسوس ما يعرف الكلمة، والباقي يعرفونها. اسألوا بعض وكشفوه!</p><button class="btn" onclick="spyStart()">ابدأ اللعبة</button>';
}
function pc(k,d,a,b){P[k]=Math.min(b,Math.max(a,P[k]+d));spy()}
function spyStart(){P.i=0;P.spy=Math.floor(Math.random()*P.n);P.w=PLACES[Math.floor(Math.random()*PLACES.length)];spyPass()}
function spyPass(){
  app.innerHTML=bar("مين الجاسوس")+'<div class="panel"><div class="huge">📱</div><p class="stat">سلّم الجوال للاعب</p><div class="huge">'+(P.i+1)+'</div><p class="stat sub">ولا أحد غيره يشوف الشاشة</p></div><button class="btn" onclick="spyShow()">اكشف دوري</button>';
}
function spyShow(){
  var s=P.i===P.spy,last=P.i===P.n-1;
  app.innerHTML=bar("لاعب "+(P.i+1))+(s?'<div class="panel dark"><div class="huge">🕵️</div><div class="huge">أنت الجاسوس!</div><p class="stat">حاول تعرف المكان من أسئلتهم، وما تنكشف</p></div>':'<div class="panel"><p class="stat">المكان</p><div class="huge">'+P.w+'</div><p class="stat sub">لا تقولها بصوت عالي!</p></div>')+'<button class="btn" onclick="spyNext()">'+(last?'ابدأ النقاش':'فهمت، التالي')+'</button>';
}
function spyNext(){P.i++;if(P.i<P.n)spyPass();else spyTalk()}
function spyTalk(){
  P.t=P.min*60;
  app.innerHTML=bar("النقاش")+'<div class="msg">اسألوا بعض عن المكان</div><div class="panel dark"><p class="stat">الوقت المتبقي</p><div class="huge" id="tm" style="font-size:68px">'+fm(P.t)+'</div></div><button class="btn" onclick="spyEnd()">اكشف الجاسوس</button>';
  clearInterval(P.timer);
  P.timer=setInterval(function(){
    P.t--;var e=document.getElementById("tm");
    if(!e){clearInterval(P.timer);return}
    if(P.t<=0){clearInterval(P.timer);e.textContent="انتهى!";try{navigator.vibrate(400)}catch(x){}}
    else e.textContent=fm(P.t);
  },1000);
}
function spyEnd(){
  clearInterval(P.timer);
  app.innerHTML=bar("النتيجة")+'<div class="panel dark"><p class="stat">الجاسوس هو</p><div class="huge">🕵️ لاعب '+(P.spy+1)+'</div><p class="stat">والمكان كان</p><div class="huge">'+P.w+'</div></div><button class="btn" onclick="spyStart()">جولة جديدة</button><button class="btn sec" onclick="spy()">الإعدادات</button>';
  setTimeout(conf,150);
}
home();
</script>
</body>
